apiVersion: v1
kind: ServiceAccount
metadata:
  name: proactive-agent
  namespace: ailab-poc
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: proactive-agent
  namespace: ailab-poc
rules:
  # Scoped to exactly what the agent does: read and patch demo-api's own replica
  # count. Nothing else in the namespace, no cluster-wide access.
  - apiGroups: ["apps"]
    resources: ["deployments", "deployments/scale"]
    resourceNames: ["demo-api"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: proactive-agent
  namespace: ailab-poc
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: proactive-agent
subjects:
  - kind: ServiceAccount
    name: proactive-agent
    namespace: ailab-poc
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: proactive-agent
  namespace: ailab-poc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: proactive-agent
  template:
    metadata:
      labels:
        app: proactive-agent
    spec:
      serviceAccountName: proactive-agent
      containers:
        - name: proactive-agent
          image: ailab/proactive-agent:local
          imagePullPolicy: IfNotPresent
          args:
            - --prom-url=http://prometheus.ailab-poc.svc.cluster.local:9090
            - --namespace=ailab-poc
            - --deployment=demo-api
            - --poll-interval=5
            - --lookahead=10
            - --cooldown=15
            - --max-replicas=4
            - --duration=86400
            - --audit-log=/dev/stdout
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
