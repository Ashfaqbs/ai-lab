apiVersion: batch/v1
kind: Job
metadata:
  name: k6-run
  namespace: ailab-poc
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: k6
          image: grafana/k6:0.54.0
          command: ["k6", "run", "/scripts/SCENARIO_PLACEHOLDER.js"]
          volumeMounts:
            - name: scripts
              mountPath: /scripts
      volumes:
        - name: scripts
          configMap:
            name: k6-scripts
