apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: ailab-poc
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s
    scrape_configs:
      - job_name: demo-api
        metrics_path: /actuator/prometheus
        dns_sd_configs:
          - names: ["demo-api-headless.ailab-poc.svc.cluster.local"]
            type: A
            port: 8080
            refresh_interval: 5s
      - job_name: kube-state-metrics
        static_configs:
          - targets: ["kube-state-metrics.ailab-poc.svc.cluster.local:8080"]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: ailab-poc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v2.54.1
          args:
            - --config.file=/etc/prometheus/prometheus.yml
          ports:
            - containerPort: 9090
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
      volumes:
        - name: config
          configMap:
            name: prometheus-config
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: ailab-poc
spec:
  selector:
    app: prometheus
  ports:
    - port: 9090
      targetPort: 9090
